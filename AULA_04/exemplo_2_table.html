<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2- Table</title>
	</head>
	
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color:white">
				<th>Cabeçalho 1 </th>
				<th>Cabeçalho 2 </th>
				<th>Cabeçalho 3 </th>
			</tr>
			
			<tr>
				<td style="background-color:black; color:white">Conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:yellow;">1</td>
							<td style="background-color:red; color:#fff; text-align:right;">2</td>
						</tr>
						
						<tr>
							<td style="background-color:blue; color:#fff;">3</td>
							<td style="background-color:#5CFF66;">4</td>
						</tr>
						
					</table>
				</td>
				<td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">Conteúdo 3</td>
			</tr>
			
			<tr>
				<td style="background-color:black; color:white">Conteúdo 4</td>
				<td style="text-align:right;background-image:url('https://acdn-us.mitiendanube.com/stores/438/755/products/ppdch49-58x58cm1-49a7246ce29c28eac015710748612874-480-0.webp');">Conteúdo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:orange; text-align:center">5</td>
							<td style="background-color:#ff00e1;">6</td>
						</tr>
						
						<tr>
							<td style="background-color:red; text-align:right;">7</td>
							<td style="background-color:orange; text-align:center ">8</td>
						</tr>
						
					</table>
				</td>
				
			</tr>
		</table>
	</body>
</html>
