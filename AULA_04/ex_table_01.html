<!DOCTYPE html>
<html lang="pt-br">
	<head>
	<meta charset="UTF-8">
	<title>Exercicio 1- Tabelas</title>
	</head>
	
	<body>
	<table border="1" width="100%">
	
		<thead>
			<tr>
				<th colspan="5" style="Background-color:#31C830">Tabela de serviços Mêcanicos</th>
			</tr>
		</thead>
		
		<tbody>
			<tr>
				<th rowspan="5" style="Background-color:#293B13">Nacionais</th>
				<td style="text-align:center; Background-color:#BBBEC3">Veículos</td>
				<td style="text-align:center; Background-color:#BBBEC3">Serviços</td>
				<td style="text-align:center; Background-color:#BBBEC3">Tempo previsto</td>
				<td style="text-align:center; Background-color:#BBBEC3">Valor</td>
			</tr>
			
			<tr>
				<td>Caminhonete S10</td>
				<td>Suspensão</td>
				<td>3 horas e 25 minutos</td>
				<td>350,00</td>
			</tr>
			
			<tr>
				<td>Caminhonete Ranger</td>
				<td>Freio</td>
				<td>3 horas e 45 minutos</td>
				<td>200,00</td>
			</tr>
			
			<tr>
				<td>Caminhonete Hilux</td>
				<td>Troca de bateria</td>
				<td>30 minutos</td>
				<td>25,00</td>
			</tr>
			
			<tr>
				<td>Caminhonete D10</td>
				<td>Alinhamento</td>
				<td>1 horas e 40 minutos</td>
				<td>220,00</td>
			</tr>
			
			
		</tbody>
	</body>
</html>
