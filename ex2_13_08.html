<!DOCTYPE html>
<html lang="pt_br"><!--Define o idioma-->
<head><!--abre a tag da parte do navegador-->
	<meta charset="UTF-8"> <!--Permite acentuação como "ç"-->
	<title>Exemplo</title> <!--Nome da guia-->
</head><!--fecha a tag de edição no navegador-->
<body><!--abre a tag de Corpo-->
	<header><!--Cabeçalho principal do texto-->
		<h1>Título da pagína</h1><!--Título da pagina-->
		<nav><!--Defini um bloco de links de navegação-->
			<p>Home</p><!--paragrafo-->
		</nav><!--fechamento do menu de navegação-->
	</header><!--fechamento do cabeçalho principal do texto-->
	<main><!-- conteúdo principal de um documento-->
		<article><!--conteúdo independente-->
			<h2>Artigo 1</h2><!--subtítulo da pagina-->
			<p>Este é um artigo sobre...</p><!--paragrafo-->
		</article><!--fecha tag de conteúdo independente-->
		<article><!--conteúdo independente-->
			<h2>Artigo 2</h2><!--subtítulo da pagina-->
			<p>ESte é outro artigo sobre...</p><!--paragrafo-->
		</article><!--fecha tag de conteúdo independente-->
	</main><!--encerramento do conteúdo principal de um documento-->
	<footer><!-- rodapé para um documento-->
		<p>&copy; 2024 Exemplo</p><!--paragrafo-->
	</footer><!--fecha tag de rodapé para um documento-->
</body><!--fecha a tag Corpo-->
</html><!--Fim do código-->
