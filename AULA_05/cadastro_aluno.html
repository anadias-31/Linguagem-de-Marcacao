<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de aluno</title>
	</head>
	
	<body>
		<header>
			<h1 style="text-align:center">Cadastro de Alunos</h1>
			<hr>
		</header>
		
		<form action="#" method="POST">
			<!--FOR para acessibilidade-->
			<label for="nome">Nome do Aluno:</label>
			<br>
			<input type="text" id="nome" name="nome" placeholder="nome do aluno..." minlength="3" maxlength="255" required>
			<br><br>
			
			<label for="ra">Registro do aluno:</label>
			<br>
			<input type="text" id="ra" name="ra" placeholder="Registro..." value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do aluno:</label>
			<br>
			<input type="email" id="email" name="email" placeholder="email@gmail.com..." required>
			<br><br>
			
			<label for="telefone">Telefone do Aluno:</label>
			<br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data de nascimento:</label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2007-01-01"  required>
			<br><br>
			
			<label for="idade">Idade do aluno:</label>
			<br>
			<input type="number" id="idade" name="idade" min="17" max="100" required>
			<br><br>
			
			<label for="genero">Gênero</label>
			<br>
			<input type="radio"  id="masculino"  name="genero" value="masculino" required>Masculino<br>
			<input type="radio" id="feminino" name="genero" value="feminino">Feminino<br>
			<input type="radio" id="outros" name="genero" value="outros">Outros<br>
			<br>
			
			<label for="turma">Selecione sua turma:</label>
			<br>
				<select name="turma" id="turma" required>
					<option value="selecione">Selecione</option>
					<option value="1EMA">1° EM A</option>
					<option value="1EMB">1° EM B</option>
					<option value="2EMA">2° EM A</option>
					<option value="2EMB">2° EM B</option>
					<option value="3EMA">3° EM A</option>
					<option value="3EMB">3° EM B</option>
				</select>
			<br><br> 
			
			<label for="foto">Foto do aluno:</label>
			<br>
			<input type="file" id="foto" name="foto" required>
			<br><br>
			
			<label for="comentarios">reclamações,comentario e elogios...</label>
			<br>
			<textarea id="comentario" name="comentarios" placeholder="texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required>Li e aceito os termos de condições</input>
			<br>
			<input type="checkbox" id="notificacoes" name="notificacoes">Aceito receber as notificações</input>
			<br><br>
			
			
			<input type="submit" value="cadastrar aluno">
			
		</form>
	</body>
</html>
