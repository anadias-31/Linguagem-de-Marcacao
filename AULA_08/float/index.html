<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Float</h2>
    <p>Serve para mudar a posição do elemnto na tela, seguindo o ancestral mais proximo.</p>
    <ul>
        <li>Float:left -> Flutua para esquerda</li>
        <li>Float:right -> Flutua para direita</li>
        <li>Clear:both -> Limpa de estilos anteriores</li>
    </ul>
    <br><br>

    <div>
        <h3>Float:left</h3>
        <p class="esquerda">Um texto.....   </p>
        <img src="https://t.ctcdn.com.br/JlHwiRHyv0mTD7GfRkIlgO6eQX8=/640x360/smart/i257652.jpeg">
    </div>

    <br>

    <div>
        <h3>Float:right</h3>
        <p class="direita">Um texto.....   </p>
        <img class="direita" src="https://t.ctcdn.com.br/JlHwiRHyv0mTD7GfRkIlgO6eQX8=/640x360/smart/i257652.jpeg">
    </div>

    <p class="limpar">Um texto qualquer!</p>
</body>
</html>
